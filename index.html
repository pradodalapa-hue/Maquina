<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JDP SMART INDUSTRIAL - V49 CELEBRATION NFC</title>
    <!-- Firebase Compat v9 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Motores Gráficos e Captura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { 
            --ouro: #fde047; 
            --carcaca: #ffcc00; 
            --tela-fundo: #FFFFFF; 
            --verde: #00a859; 
            --vermelho: #e81c24; 
            --preto-pos: #020617; 
            --azul: #06b6d4; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-family: 'Segoe UI', sans-serif; }
        body, html { background: #000; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .smart-pos { 
            background: var(--carcaca); width: 100%; max-width: 480px; height: 100%; 
            display: flex; flex-direction: column; padding: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        
        .moldura-visor {
            background: var(--tela-fundo); flex: 4; border-radius: 20px; margin-bottom: 8px;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 4px solid var(--ouro); position: relative;
        }
        
        .visor-interno { background: #FFF; flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .camada { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #FFF; padding: 8px; text-align: center; }
        
        #v-grande { font-size: 4.2rem; color: #000; font-weight: 900; }
        .logo-dony { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--carcaca); }
        
        .box-barcode { background: #f0f0f0; padding: 5px; border-radius: 6px; width: 100%; max-height: 75px; overflow-y: auto; margin-top: 4px; border: 1px solid #ddd; }
        .code-text { font-size: 0.5rem; word-break: break-all; font-family: monospace; font-weight: bold; color: #333; line-height: 1.1; }
        
        .helena-bar {
            background: #020617; color: var(--azul); font-size: 9px; text-align: center; padding: 5px; font-weight: bold;
            border-bottom: 1px solid var(--ouro); letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .painel-teclado { background: var(--preto-pos); padding: 10px; border-radius: 20px; flex: 1.8; display: flex; flex-direction: column; border: 2px solid var(--ouro); }
        .grid-teclas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
        
        .tecla { 
            background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: var(--ouro);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 3px #000; cursor: pointer;
        }
        .tecla:active { transform: translateY(2px); box-shadow: 0 1px #000; }
        .n { font-size: 1.4rem; font-weight: 900; }
        .abc { font-size: 0.5rem; color: #888; font-weight: bold; margin-top: -4px; }
        
        .btn-acao { border: none; font-weight: 900; font-size: 0.7rem; border-radius: 8px; color: #fff; }
        .cancel { background: var(--vermelho); }
        .clear { background: #f9d80c; color: #000; }
        .confirm { background: var(--verde); }
        
        .extras { display: flex; gap: 6px; margin-top: 8px; height: 38px; }
        .btn-e { flex: 1; border: none; border-radius: 8px; font-weight: 900; font-size: 0.7rem; cursor: pointer; }
        .btn-zap { background: #25D366; color: #fff; }
        .btn-print { background: var(--ouro); color: #000; }
        .btn-bt { background: #0044cc; color: #fff; }
        
        #modal-auditoria { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; padding: 20px; border: 5px solid var(--ouro); }
        .total-caixa { color: #00ff00; font-size: 1.8rem; text-align: center; border: 1px solid #00ff00; margin: 15px 0; padding: 10px; font-weight: 900; }
        .install-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: none; }
        #btnInstallPWA { background: linear-gradient(135deg, #d4af37, #aa8c2c); color: #000000; border: 2px solid #ffd700; padding: 15px 25px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
 
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bf953f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="icon" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body onclick="entrarFullScreen()">
    <div class="install-container" id="installContainer">
        <button id="btnInstallPWA" onclick="instalarApp()">INSTALAR SISTEMA</button>
    </div>
    
    <div id="modal-auditoria">
        <div style="display:flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--ouro); padding-bottom: 10px;">
            <h2 style="color:var(--ouro)">JDP AUDITORIA</h2>
            <button onclick="fecharAuditoria()" style="background:var(--ouro); padding:8px; font-weight:900;">X</button>
        </div>
        <div class="total-caixa" id="soma-total">TOTAL: R$ 0,00</div>
        <div id="lista-pix" style="flex:1; overflow-y:auto; color:#fff; font-family:monospace; font-size:0.8rem;"></div>
        <button onclick="limparCaderno()" style="background:red; color:#fff; padding:15px; border:none; font-weight:900; margin-top:10px;">LIMPAR TUDO</button>
    </div>

    <div class="smart-pos">
        <div class="moldura-visor">
            <div class="helena-bar" id="helena-status">
                <span style="color: #fde047;">★ CENTRAL HELENA</span> | SISTEMA PRONTO
            </div>
            
            <div id="btn-secreto" onclick="abrirAuditoria()" style="position:absolute; top:25px; left:0; width:50px; height:50px; z-index:100;"></div>
            
            <div class="visor-interno">
                <div id="tela-logo" class="camada" style="display:flex;">
                    <img src="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790117781506_Engenheiro_Transparente__5_.png" style="width: 140px;" crossorigin="anonymous">
                    <p style="margin-top:15px; color:var(--ouro); font-weight:900; letter-spacing:2px; font-size: 0.9rem;">ESTACIONAMENTO DETRAN</p>
                </div>

                <div id="tela-digito" class="camada">
                    <p style="font-size: 0.75rem; color: #999; font-weight:900;">VALOR DA VENDA</p>
                    <div id="v-grande">R$ 0,00</div>
                </div>

                <!-- CAMADA PIX COM QRCODE OTIMIZADO -->
                <div id="area-pix" class="camada">
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; border-bottom: 1px dashed #ccc; padding-bottom: 4px; margin-bottom: 4px;">
                        <img src="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790117781506_Engenheiro_Transparente__5_.png" class="logo-dony" crossorigin="anonymous">
                        <p style="font-weight:900; font-size:0.7rem; margin-top: 2px;">DONINA H L SOUZA</p>
                    </div>
                    <div id="qr-code" style="padding: 6px; background: white; border-radius: 6px; display: inline-block;"></div>
                    <p id="pix-valor-txt" style="font-size: 1.3rem; font-weight: 900; margin-top: 2px;">R$ 0,00</p>
                    <div class="box-barcode">
                        <p style="font-size:0.45rem; color:#999; font-weight:900;">PIX COPIA E COLA</p>
                        <p id="payload-txt" class="code-text">Gerando...</p>
                    </div>
                </div>

                <!-- TELA DE SUCESSO -->
                <div id="tela-sucesso" class="camada" style="background: #000; padding: 0; overflow: hidden; position: absolute; inset: 0;">
                    <video id="video-sucesso-pos" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;" loop muted playsinline></video>
                    <div style="position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); padding: 20px; width: 100%; height: 100%;">
                        <div style="font-size: 4rem; color: var(--verde); line-height: 1;">✓</div>
                        <p style="font-weight: 900; font-size: 1.8rem; color: var(--verde);">PAGO!</p>
                        <div id="confirmacao-valor" style="font-size: 1.6rem; font-weight: 900; color: var(--ouro); background: rgba(15, 23, 42, 0.9); padding: 8px 30px; border-radius: 40px; margin-top: 8px; border: 2px solid var(--ouro);"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="painel-teclado">
            <div class="grid-teclas">
                <button class="tecla" onclick="input('1')"><span class="n">1</span><span class="abc">QZ</span></button>
                <button class="tecla" onclick="input('2')"><span class="n">2</span><span class="abc">ABC</span></button>
                <button class="tecla" onclick="input('3')"><span class="n">3</span><span class="abc">DEF</span></button>
                <button class="btn-acao cancel" onclick="reset()">X</button>
                
                <button class="tecla" onclick="input('4')"><span class="n">4</span><span class="abc">GHI</span></button>
                <button class="tecla" onclick="input('5')"><span class="n">5</span><span class="abc">JKL</span></button>
                <button class="tecla" onclick="input('6')"><span class="n">6</span><span class="abc">MNO</span></button>
                <button class="btn-acao clear" onclick="gatilhoBotaoAmarelo()">CORR</button>
                
                <button class="tecla" onclick="input('7')"><span class="n">7</span><span class="abc">PRS</span></button>
                <button class="tecla" onclick="input('8')"><span class="n">8</span><span class="abc">TUV</span></button>
                <button class="tecla" onclick="input('9')"><span class="n">9</span><span class="abc">WXY</span></button>
                <button class="btn-acao confirm" onclick="gerarPagamento()">ENTRA</button>
                
                <button class="tecla"><span class="n">*</span></button>
                <button class="tecla" onclick="input('0')"><span class="n">0</span></button>
                <button class="tecla"><span class="n">#</span></button>
                <!-- BOTÃO .00 CONFIGURADO PARA ATIVAR O LEITOR NFC -->
                <button class="tecla" onclick="iniciarLeituraNFC()"><span class="n">.00</span><span class="abc">NFC</span></button>
            </div>
            <div class="extras">
                <button class="btn-e btn-bt" onclick="conectarBT()">BT</button>
                <button class="btn-e btn-zap" onclick="compartilharPix()">ZAP</button>
                <button class="btn-e btn-print" onclick="imprimirTicket()">PRINT</button>
            </div>
        </div>
    </div>

    <script>
        const VIDEO_COMEMORACAO = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/media/jdp_1786372933817_gemini_generated_video_6e940877.mp4";
        const CHAVE = "doninah@gmail.com";
        const CIDADE = "FORTALEZA";
        const NOME_EMISSOR = "DONINA H L SOUZA";
        
        const fbConfig = { 
            apiKey: "", 
            databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installContainer').style.display = 'block'; });
        function instalarApp() { if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('installContainer').style.display = 'none'; } }

        let montante = "", status = "TV", motorBT = null;

        db.ref('caixa_pagamento').on('value', snap => {
            const info = snap.val();
            if (info && info.status === "RECEBIDO" && (status === "PIX" || status === "WAIT")) {
                confirmarFinal(info.valor);
            }
        });

        function show(id) {
            document.querySelectorAll('.camada').forEach(c => c.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function input(n) {
            if(status === "OK") reset();
            status = "DIG";
            show('tela-digito');
            montante += n;
            atualizarVisor();
        }

        function atualizarVisor() {
            let val = (parseFloat(montante)/100) || 0;
            document.getElementById('v-grande').innerText = val.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        }

        function apagar() {
            montante = montante.slice(0,-1);
            if(!montante) reset();
            else atualizarVisor();
        }

        function gatilhoBotaoAmarelo() {
            if (status === "PIX") {
                atualizarHelenaStatus("FORÇANDO CELEBRAÇÃO MANUAL...");
                const valorVenda = (parseFloat(montante)/100).toFixed(2);
                confirmarFinal(valorVenda);
            } else {
                apagar();
            }
        }

        function reset() {
            montante = "";
            status = "TV";
            show('tela-logo');
            atualizarHelenaStatus("OPERACIONAL PRONTO");
            
            const v = document.getElementById('video-sucesso-pos');
            v.pause();
            v.src = "";
            
            db.ref('publicidade/prado_68/qr_venda_ativa').remove();
        }

        function gerarPagamento() {
            if(!montante) return;
            status = "PIX";
            show('area-pix');
            atualizarHelenaStatus("GERANDO PIX BACEN PADRÃO...");

            const v = (parseFloat(montante)/100).toFixed(2);
            document.getElementById('pix-valor-txt').innerText = "R$ " + v.replace('.',',');

            db.ref('caixa_pagamento').set({ status: "AGUARDANDO", valor_aguardando: v.replace('.', ',') });

            const formatField = (id, val) => {
                const len = val.length.toString().padStart(2, '0');
                return id + len + val;
            };

            const guiPix = formatField("00", "br.gov.bcb.pix") + formatField("01", CHAVE.trim());
            const merchantAccount = formatField("26", guiPix);
            
            const mcc = "52040000";
            const moeda = "5303986"; 
            const valorField = formatField("54", v);
            const pais = "5802BR";
            const nomeField = formatField("59", NOME_EMISSOR.substring(0, 25));
            const cidadeField = formatField("60", CIDADE.substring(0, 15));
            
            const additionalData = formatField("05", "***");
            const sub62 = formatField("62", additionalData);

            let payload = "000201" + 
                          merchantAccount + 
                          mcc + 
                          moeda + 
                          valorField + 
                          pais + 
                          nomeField + 
                          cidadeField + 
                          sub62 + 
                          "6304";

            let crc = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                crc ^= (payload.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc <<= 1;
                    }
                    crc &= 0xFFFF;
                }
            }
            let pixCode = payload + crc.toString(16).toUpperCase().padStart(4, '0');

            document.getElementById('payload-txt').innerText = pixCode;
            const qrContainer = document.getElementById('qr-code');
            qrContainer.innerHTML = "";

            new QRCode(qrContainer, {
                text: pixCode,
                width: 130,
                height: 130,
                correctLevel: QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                atualizarHelenaStatus("CONVERTENDO QRCODE...");
                html2canvas(document.getElementById('area-pix'), { 
                    useCORS: true,
                    allowTaint: true,
                    scale: 1.2
                }).then(canvas => {
                    atualizarHelenaStatus("SINCRONIZANDO TV...");
                    const qrBase64 = canvas.toDataURL('image/jpeg', 0.75);

                    db.ref('publicidade/prado_68/qr_venda_ativa').set(qrBase64)
                    .then(() => {
                        atualizarHelenaStatus("TV SINCRONIZADA INSTANTÂNEO");
                    }).catch(err => {
                        atualizarHelenaStatus("ERRO DE SINCRONIZAÇÃO");
                        console.error(err);
                    });
                });
            }, 800);
        }

        async function iniciarLeituraNFC() {
            if (!montante || montante === "") {
                atualizarHelenaStatus("DIGITE O VALOR PRIMEIRO");
                return;
            }

            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    atualizarHelenaStatus("APROXIME O CARTÃO NFC...");

                    ndef.onreading = event => {
                        const decoder = new TextDecoder();
                        for (const record of event.records) {
                            const dadosNFC = decoder.decode(record.data);
                            console.log("Dado NFC Lido: ", dadosNFC);
                        }
                        const valorVenda = (parseFloat(montante)/100).toFixed(2);
                        confirmarFinal(valorVenda);
                    };
                } catch (error) {
                    alert("Erro ao iniciar NFC: " + error);
                    atualizarHelenaStatus("FALHA NO HARDWARE NFC");
                }
            } else {
                alert("Este dispositivo ou navegador não suporta leitura NFC via Web.");
                atualizarHelenaStatus("NFC NÃO SUPORTADO");
            }
        }

        function confirmarFinal(valorRecebido) {
            status = "OK";
            tocarSom();
            atualizarHelenaStatus("CELEBRANDO COMPRA!");

            let valorFormatado = parseFloat(valorRecebido).toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });

            document.getElementById('confirmacao-valor').innerText = valorFormatado;

            let valorEsperado = parseFloat((parseFloat(montante)/100).toFixed(2));
            if (parseFloat(valorRecebido) < valorEsperado) {
                document.getElementById('confirmacao-valor').style.color = "red";
                document.querySelector('#tela-sucesso p').innerText = "VALOR PARCIAL!";
                document.querySelector('#tela-sucesso p').style.color = "red";
            } else {
                document.getElementById('confirmacao-valor').style.color = "var(--ouro)";
                document.querySelector('#tela-sucesso p').innerText = "PAGO!";
                document.querySelector('#tela-sucesso p').style.color = "var(--verde)";
            }

            const videoPos = document.getElementById('video-sucesso-pos');
            videoPos.src = VIDEO_COMEMORACAO;
            videoPos.play().catch(e => console.log(e));

            show('tela-sucesso');

            db.ref('publicidade/prado_68/qr_venda_ativa').set(VIDEO_COMEMORACAO);

            let hist = JSON.parse(localStorage.getItem('jdp_auditoria') || '[]');
            hist.push({ 
                data: new Date().toLocaleString('pt-BR'), 
                valor: valorRecebido.toString().replace('.', ',') 
            });
            localStorage.setItem('jdp_auditoria', JSON.stringify(hist));

            if(motorBT) imprimirTicket();

            setTimeout(reset, 12000);
        }

        function atualizarHelenaStatus(msg) {
            document.getElementById('helena-status').innerHTML = `<span style="color: var(--azul);">HELENA: ${msg}</span>`;
        }

        async function conectarBT() {
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const chars = await service.getCharacteristics();
                motorBT = chars.find(c => c.properties.write);
                if(motorBT) alert("Impressora Conectada!");
            } catch (e) { alert("Erro BT: " + e); }
        }

        async function imprimirTicket() {
            if(!motorBT || !montante) return;
            const v = (parseFloat(montante)/100).toFixed(2);
            const texto = `\x1B\x61\x01JDP INDUSTRIAL\nRECIBO PIX: R$ ${v.replace('.', ',')}\n\n\n\n`;
            await motorBT.writeValue(new TextEncoder().encode(texto));
        }

        async function compartilharPix() {
            const canvas = await html2canvas(document.getElementById('area-pix'));
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "pix_jdp.png", { type: "image/png" });
                const code = document.getElementById('payload-txt').innerText;
                if (navigator.share) await navigator.share({ files: [file], text: code });
            });
        }

        function abrirAuditoria() { if(prompt("SENHA JDP:") === "1234") { document.getElementById('modal-auditoria').style.display="flex"; renderizarAuditoria(); } }
        function fecharAuditoria() { document.getElementById('modal-auditoria').style.display="none"; }
        function renderizarAuditoria() {
            let hist = JSON.parse(localStorage.getItem('jdp_auditoria') || '[]');
            let soma = hist.reduce((a, b) => a + parseFloat(b.valor.replace(',', '.')), 0);
            document.getElementById('lista-pix').innerHTML = hist.map(v => `<div>${v.data} - R$ ${v.valor}</div>`).reverse().join('');
            document.getElementById('soma-total').innerText = `TOTAL: R$ ${soma.toFixed(2).replace('.', ',')}`;
        }
        function limparCaderno() { if(confirm("APAGAR TUDO?")) { localStorage.removeItem('jdp_auditoria'); renderizarAuditoria(); } }
        function entrarFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); }
        function tocarSom() { const ctx = new AudioContext(); const osc = ctx.createOscillator(); osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.2); }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => console.log('SISTEMA JDP: MOTOR ATIVO'));
            });
        }
    </script>
</body>
</html>
